# Configuracion compartida del sitio Infinity Water.
#
# Destino en el VPS: /etc/nginx/snippets/infinitywater-common.conf
#
# La incluyen el vhost de preview y el de produccion, para que lo que se
# verifica en preview sea exactamente lo que despues sirve el dominio real.

root /var/www/static/infinitywater/dist;
index index.html;

# Cabeceras de seguridad.
#
# Van solo a nivel de server y NO se repiten dentro de los location: en
# nginx, un location con su propio add_header deja de heredar los de
# arriba. Por eso el control de cache se hace con `expires`, que no rompe
# esa herencia, en vez de con add_header Cache-Control.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml application/xml application/javascript application/json image/svg+xml;

# Los assets llevan hash en el nombre: pueden cachearse indefinidamente.
location ~* \.(?:js|css|woff2?|ttf|eot)$ {
    expires 1y;
    access_log off;
}

location ~* \.(?:webp|png|jpe?g|gif|svg|ico)$ {
    expires 30d;
    access_log off;
}

location = /sitemap.xml { expires 1d; }
location = /robots.txt  { expires 1d; }

# El build genera un index.html por ruta: /privacy-policy/index.html,
# /es/index.html, /free-water-test/index.html...
#
# `$uri/index.html` va ANTES que `$uri/` a proposito. Con el orden estandar
# ($uri $uri/ /index.html) nginx responderia 301 de /privacy-policy a
# /privacy-policy/, y esas cuatro URLs son las que revisa la operadora para
# la campana A2P 10DLC: deben responder 200 directo, sin saltos.
#
# El ultimo fallback a /index.html deja que el router de React resuelva
# cualquier ruta desconocida y pinte su propia 404.
location / {
    try_files $uri $uri/index.html $uri/ /index.html;
    expires -1;
}

# Sin esto, una ruta inexistente devolveria la pagina de error de nginx en
# lugar de la 404 del sitio.
error_page 404 /index.html;
