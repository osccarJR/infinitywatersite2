# Panel de gestion en su propio dominio: admin.infinitywatersite.com
#
# Destino en el VPS: /etc/nginx/sites-available/infinitywater-admin
# Enlace:            /etc/nginx/sites-enabled/infinitywater-admin
#
# Va aparte del sitio publico (www) a proposito: el sitio publico carga
# scripts de terceros (formulario, analitica) y, si compartieran el mismo
# origen, uno de esos scripts podria leer el panel con la sesion del dueno.
# En su propio dominio, la cookie de sesion no existe para www.
#
# Certbot anade el bloque 443 al emitir el certificado:
#   certbot --nginx -d admin.infinitywatersite.com --redirect

server {
    listen 80;
    listen [::]:80;
    server_name admin.infinitywatersite.com;

    # Cabeceras de seguridad (solo a nivel de server: los location las heredan).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=()" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

    # La app vive en /admin (asi no cambia ningun enlace ni la instalacion en el telefono).
    location = / {
        return 302 /admin/;
    }

    location = /admin {
        proxy_pass http://127.0.0.1:3042;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /admin/ {
        proxy_pass http://127.0.0.1:3042;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        client_max_body_size 2m;
    }

    location / {
        return 404;
    }
}
