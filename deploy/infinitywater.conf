# Vhost de Infinity Water.
#
# Destino en el VPS: /etc/nginx/sites-available/infinitywater
# Enlace:            /etc/nginx/sites-enabled/infinitywater
#
# Dos bloques que comparten la misma configuracion:
#   - preview:    infinitywater.nivusoftware.com
#   - produccion: infinitywatersite.com + www.infinitywatersite.com
#
# Certbot anadira aqui los bloques TLS al emitir cada certificado.

# ----------------------------- preview -----------------------------
server {
    listen 80;
    listen [::]:80;
    server_name infinitywater.nivusoftware.com;

    include snippets/infinitywater-common.conf;
}

# --------------------------- produccion ----------------------------
server {
    listen 80;
    listen [::]:80;
    server_name infinitywatersite.com www.infinitywatersite.com;

    include snippets/infinitywater-common.conf;
}
