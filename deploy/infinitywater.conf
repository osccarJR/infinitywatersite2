# Vhost de Infinity Water.
#
# Destino en el VPS: /etc/nginx/sites-available/infinitywater
# Enlace:            /etc/nginx/sites-enabled/infinitywater
#
# El dominio canonico es CON www: es el que ya usaba la redireccion
# anterior, el que Google tiene indexado y el que aparece en la
# especificacion A2P 10DLC que se registra ante la operadora. El canonical,
# el sitemap, los hreflang y el JSON-LD del sitio apuntan todos ahi.
#
# Certbot anadira aqui los bloques TLS al emitir cada certificado.

# ----------------------------- preview -----------------------------
# Sirve el sitio completo para poder verificarlo sin tocar produccion.
server {
    listen 80;
    listen [::]:80;
    server_name infinitywater.nivusoftware.com;

    include snippets/infinitywater-common.conf;
}

# --------------------- produccion: sin www -> www --------------------
# Solo redirige. Mantener una unica version servida evita contenido
# duplicado y que la operadora encuentre dos URLs distintas para la misma
# pagina legal.
server {
    listen 80;
    listen [::]:80;
    server_name infinitywatersite.com;

    return 301 https://www.infinitywatersite.com$request_uri;
}

# ------------------------ produccion: canonica -----------------------
server {
    listen 80;
    listen [::]:80;
    server_name www.infinitywatersite.com;

    include snippets/infinitywater-common.conf;
}
