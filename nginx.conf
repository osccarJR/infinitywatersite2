server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Los assets llevan hash en el nombre, asi que el HTML es lo unico que
  # debe revalidarse en cada visita.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  location ~* \.(?:js|css|woff2?|ttf|eot)$ {
    expires 1y;
    access_log off;
  }

  location ~* \.(?:webp|avif|png|jpe?g|gif|svg|ico)$ {
    expires 30d;
    access_log off;
  }

  location = /sitemap.xml { expires 1d; }
  location = /robots.txt  { expires 1d; }

  # El build genera un index.html por ruta (/, /es, /privacy-policy...).
  # `$uri/index.html` va antes que `$uri/` para servir /es sin 301 a /es/,
  # y lo que no existe responde 404 real con la pagina 404 del sitio.
  #
  # Cache-Control se fija con `expires` y no con add_header: un add_header
  # dentro de un location anula las cabeceras de seguridad de arriba.
  location / {
    try_files $uri $uri/index.html =404;
    expires -1;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
  }
}
