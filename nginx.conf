server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Los assets llevan hash en el nombre, asi que el HTML es lo unico que
  # debe revalidarse en cada visita.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  location ~* \.(?:js|css|woff2?|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  location ~* \.(?:webp|png|jpe?g|gif|svg|ico)$ {
    expires 30d;
    add_header Cache-Control "public";
    access_log off;
  }

  location = /sitemap.xml { expires 1d; }
  location = /robots.txt  { expires 1d; }

  # El build genera un index.html por ruta (/, /es, /privacy-policy...).
  #
  # `$uri/index.html` va antes que `$uri/` a proposito: con `$uri/` nginx
  # responderia 301 de /es a /es/, y la URL canonica que anuncia la pagina
  # es /es sin barra. Asi se sirve el fichero directamente, sin redireccion.
  # Solo si no existe se cae al index raiz y toma el control el router.
  location / {
    try_files $uri $uri/index.html $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }

  error_page 404 /index.html;
}
